services:
  smartbess-db:
    image: timescale/timescaledb:latest-pg16
    container_name: smartbess-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: smartbess
    ports:
      # 127.0.0.1-only: досі був "5432:5432" (0.0.0.0) з дефолтним postgres/postgres —
      # саме ця комбінація вже призвела до знесення БД ransomware-ботом
      # 2026-07-15/16 (див. CLAUDE.md). Порт лишається доступним з хоста для
      # локального дебагу (psql), але не з інтернету.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbess"]
      interval: 5s
      timeout: 5s
      retries: 5

  smartbess-redis:
    image: redis:7-alpine
    container_name: smartbess-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  smartbess-platform:
    build: .
    container_name: smartbess-platform
    ports:
      - "5004:5000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@smartbess-db:5432/smartbess
      - REDIS_URL=redis://:${REDIS_PASSWORD}@smartbess-redis:6379/0
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ENTSOE_API_KEY=${ENTSOE_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      smartbess-db:
        condition: service_healthy
      smartbess-redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
